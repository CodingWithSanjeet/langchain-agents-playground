[project]
name = "langchain-mastery-guide"
version = "0.1.0"
description = "A comprehensive hands-on guide and notebook collection for LangChain 1.x, multi-provider LLM integrations (OpenAI, Gemini, Groq), and AI agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.2.3",
]
